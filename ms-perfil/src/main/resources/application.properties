server.port=8082
spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USERNAME}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=none
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# Documentos del conductor (E2-02 / E2-03)
# Límite de subida: 5 MB por archivo. max-swallow-size permite responder el
# error 413 en español en lugar de cortar la conexión con archivos grandes.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
server.tomcat.max-swallow-size=20MB

# Supabase Storage (bucket privado). Los valores reales van en el .env de la
# raíz y NO se versionan. Si faltan, ms-perfil arranca y solo la subida de
# documentos responde 503 con un mensaje claro.
supabase.url=${SUPABASE_URL:}
supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY:}
supabase.storage.bucket=documentos
supabase.storage.minutos-enlace=5
