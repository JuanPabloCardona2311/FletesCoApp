# Sitio de nginx para FletesCo en Ubuntu Server.
# Se instala en /etc/nginx/sites-available/fletesco (ver README.md, sección
# "Despliegue en Ubuntu Server").
#
# nginx es lo único que se expone hacia fuera. Reparte cada petición por el
# inicio de la ruta hacia los contenedores, que solo escuchan en 127.0.0.1
# (docker-compose.servidor.yml).

server {
    listen 80;
    server_name _;

    # ms-perfil acepta documentos de hasta 5 MB por archivo y 6 MB por
    # petición; el límite de nginx (1 MB por defecto) debe quedar por encima.
    client_max_body_size 10M;

    # Encabezados que llegan a todos los servicios.
    # Host con $http_host (y no $host) conserva el puerto con el que entró el
    # navegador, p. ej. localhost:8080 si se llega por un puerto reenviado.
    # Así Spring ve el mismo origen que envía el navegador y no trata la
    # petición como CORS.
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Prefijos sin barra final y proxy_pass sin URI: la ruta llega completa
    # al microservicio (/api/auth/login -> http://127.0.0.1:8081/api/auth/login),
    # que ya define sus endpoints con el prefijo /api/...

    # ms-auth: registro, login y recuperación de contraseña.
    location /api/auth {
        proxy_pass http://127.0.0.1:8081;
    }

    # ms-perfil: perfiles, vehículos, ubicación y documentos.
    location /api/perfiles {
        proxy_pass http://127.0.0.1:8082;
    }

    # ms-solicitudes: publicar, aceptar y seguir fletes.
    location /api/solicitudes {
        proxy_pass http://127.0.0.1:8083;
    }

    # ms-admin-reportes: usuarios, disputas y reportes.
    location /api/admin {
        proxy_pass http://127.0.0.1:8084;
    }

    # Todo lo demás es el frontend (contenedor con su propio nginx, que ya
    # resuelve las rutas de React como /perfil o /admin/usuarios).
    location / {
        proxy_pass http://127.0.0.1:5173;
    }
}
