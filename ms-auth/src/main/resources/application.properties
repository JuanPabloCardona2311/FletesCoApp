server.port=8081

# Datasource (variables de entorno; ver .env.example)
spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USERNAME}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA — las tablas ya existen en Supabase, no tocarlas
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# Recuperación de contraseña (E1-05)
# simulada=true: no se envía correo, el enlace se escribe en el log de ms-auth.
app.recuperacion.simulada=true
app.recuperacion.url-frontend=http://localhost:5173
app.recuperacion.minutos-validez=30
