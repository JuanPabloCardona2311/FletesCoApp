server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Archivos generados por Vite: llevan un hash en el nombre, se pueden
    # guardar en caché un año sin riesgo de servir versiones viejas.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html nunca en caché: así el navegador siempre recibe las
    # referencias a los assets de la última versión.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Fallback de SPA: cualquier ruta que no sea un archivo real (/perfil,
    # /admin/usuarios, ...) devuelve index.html y react-router la resuelve.
    location / {
        try_files $uri /index.html;
    }
}
